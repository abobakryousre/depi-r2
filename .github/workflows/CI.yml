name: CI

on:
  push:
    branches: [ "*" ]


jobs:
  Checkout:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: list code
        run: ls 
  Buld:
    runs-on: ubuntu-latest 
    needs: Checkout
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker buld . -t my-app
  Test:
    runs-on: ubuntu-latest
    needs: Buld
    steps:
      - name: Testing
        run: echo "testing"

  Release:
    runs-on: ubuntu-latest 
    needs: Test
    steps:
      - name: Push Docker image
        run: echo "pushing docker image"


